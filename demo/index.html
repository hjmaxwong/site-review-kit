<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Review Kit demo</title>
  <link rel="stylesheet" href="/review.css">
  <style>
    body { margin: 0; font: 16px/1.6 system-ui, sans-serif; color: #1b1f27; background: #fff; }
    header, section, footer { padding: 64px 24px; max-width: 900px; margin: 0 auto; }
    header { background: #f2f5fa; max-width: none; text-align: center; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .card { padding: 24px; border-radius: 16px; background: #f7f8fb; }
  </style>
</head>
<body>
  <header><h1>Demo client website</h1><p>Press <b>Review</b> (bottom right) to leave feedback.</p></header>
  <section id="services"><h2>Services</h2>
    <div class="cards"><div class="card"><h3>Design</h3><p>Lorem ipsum dolor sit amet.</p></div>
      <div class="card"><h3>Build</h3><p>Consectetur adipiscing elit.</p></div>
      <div class="card"><h3>Launch</h3><p>Sed do eiusmod tempor.</p></div></div></section>
  <section id="about"><h2>About</h2><p>Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</p></section>
  <footer>© Demo company</footer>
  <!-- On a real site, load review.js from wherever your review backend is hosted -->
  <script src="/review.js" data-team="the Demo Co. team" defer></script>
</body>
</html>
